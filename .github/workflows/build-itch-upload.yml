name: Build room-code multiplayer test ZIP

on:
  push:
    branches: [netplay-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this test branch
        uses: actions/checkout@v4

      - name: Check out the existing fiiight browser game
        uses: actions/checkout@v4
        with:
          repository: mathmati/fiiight
          path: source

      - name: Apply experimental room-code netplay patch
        run: |
          git -C source apply "$GITHUB_WORKSPACE/patches/netplay.patch"
          cp patches/netplay_transport_js.go source/engine/src/netplay_transport_js.go
          cp patches/netplay_transport_native.go source/engine/src/netplay_transport_native.go
          cp patches/room-code.js source/web/room-code.js
          node --check source/web/room-code.js

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: true
          cache-dependency-path: source/engine/go.sum

      - name: Build browser game
        working-directory: source
        run: bash build/wasm.sh

      - name: Verify browser package
        run: |
          test -s source/web/index.html
          test -s source/web/ikemen.wasm
          test -s source/web/wasm_exec.js
          test -s source/web/content.zip
          test -s source/web/room-code.js
          echo "Room-code browser package built."

      - name: Package test ZIP
        run: |
          cd source/web
          zip -qr ../../Ikemen-GO-room-code-test.zip .
          cd ../..
          ls -lh Ikemen-GO-room-code-test.zip

      - name: Save test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ikemen-GO-room-code-test
          path: Ikemen-GO-room-code-test.zip
          if-no-files-found: error
          retention-days: 14
